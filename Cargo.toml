[workspace]
resolver = "2"
members = [
    "compiler/ori_ir",
    "compiler/ori_registry",
    "compiler/ori_diagnostic",
    "compiler/ori_lexer_core",
    "compiler/ori_lexer",
    "compiler/ori_types",
    "compiler/ori_parse",
    "compiler/ori_patterns",
    "compiler/ori_eval",
    "compiler/ori_fmt",
    "compiler/ori_arc",
    "compiler/ori_repr",
    "compiler/ori_canon",
    "compiler/ori_compiler",
    "compiler/ori_stack",
    "compiler/oric",
    "compiler/ori_llvm",
    "compiler/ori_rt",
    "compiler/ori_test_harness",
]
# All crates including ori_llvm are in default-members; LLVM 21 is required for oric builds.
default-members = [
    "compiler/ori_ir",
    "compiler/ori_registry",
    "compiler/ori_diagnostic",
    "compiler/ori_lexer_core",
    "compiler/ori_lexer",
    "compiler/ori_types",
    "compiler/ori_parse",
    "compiler/ori_patterns",
    "compiler/ori_eval",
    "compiler/ori_fmt",
    "compiler/ori_arc",
    "compiler/ori_repr",
    "compiler/ori_canon",
    "compiler/ori_compiler",
    "compiler/ori_stack",
    "compiler/oric",
    "compiler/ori_llvm",
    "compiler/ori_rt",
    "compiler/ori_test_harness",
]
# Excluded crates (not part of workspace at all):
# - ori-lsp: Not yet updated to use new compiler
exclude = ["fuzz",
    "tools/ori-lsp",
]

[workspace.package]
version = "2026.4.26-alpha.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/upstat-io/ori-lang"

[workspace.dependencies]
logos = "0.14"
ariadne = "0.4"
thiserror = "1.0"
rayon = "1.10"
pretty_assertions = "1.4"
salsa = "0.18"
dashmap = "6.1"
parking_lot = "0.12"
crossbeam = "0.8"
rustc-hash = "2.1"
smallvec = { version = "1", features = ["const_generics"] }
stacker = "0.1"
proptest = "1.4"
bitflags = "2.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-tree = "0.4"
serde = { version = "1", features = ["derive"] }
bincode = "1"

# Internal crates (workspace members only; excluded crates use path deps directly)
ori_ir = { path = "compiler/ori_ir" }
ori_registry = { path = "compiler/ori_registry" }
ori_diagnostic = { path = "compiler/ori_diagnostic" }
ori_lexer_core = { path = "compiler/ori_lexer_core" }
ori_lexer = { path = "compiler/ori_lexer" }
ori_types = { path = "compiler/ori_types" }
ori_parse = { path = "compiler/ori_parse" }
ori_patterns = { path = "compiler/ori_patterns" }
ori_eval = { path = "compiler/ori_eval" }
ori_fmt = { path = "compiler/ori_fmt" }
ori_arc = { path = "compiler/ori_arc" }
ori_repr = { path = "compiler/ori_repr" }
ori_canon = { path = "compiler/ori_canon" }
ori_compiler = { path = "compiler/ori_compiler" }
ori_stack = { path = "compiler/ori_stack" }

# Workspace-wide lint configuration
[workspace.lints.rust]
unsafe_code = "deny"
dead_code = "deny"
unused = { level = "deny", priority = -1 }
# C-A1 (missing /// on pub item).
# Staged promotion: `allow` (pre-cleanup baseline) → `warn` (post-cleanup,
# surfaces new violations) → `deny` (gating). `clippy-all.sh` denies all
# warnings, so `warn` here would block builds against ~886 pre-existing
# missing-docs sites. Run the doc-comment cleanup pass before flipping
# to `warn`.
missing_docs = "allow"
# SF-3 (impl-hygiene.md §Unsafe & FFI): each unsafe op in an `unsafe fn` body
# needs its own `unsafe {}` + `// SAFETY:`. 0 pre-existing hits at probe.
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
allow_attributes_without_reason = "warn"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
needless_return = "deny"
print_stdout = "allow"
print_stderr = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "deny"
cognitive_complexity = "deny"
similar_names = "allow"
# C-A5 (// SAFETY: on unsafe blocks).
# clippy::restriction tier — staged promotion `allow` (current) → `warn`
# (post-cleanup) → `deny` (gating). `clippy-all.sh` denies warnings, so
# `warn` here would block builds against pre-existing un-annotated unsafe
# blocks. Run the SAFETY-annotation cleanup pass on ori_llvm, ori_rt,
# oric before flipping to `warn`.
undocumented_unsafe_blocks = "allow"

# Rust-cleanliness lints (impl-hygiene.md PA-/SF-/AR-/EH-/CL-/LN- families +
# §Finding Categories ARITH/SOUNDNESS). ENABLED: 0 pre-existing hits at probe.
fallible_impl_from = "warn"            # PA-2: panic/unwrap in `impl From` -> TryFrom
# STAGED (allow now -> warn/deny after a cleanup pass). Counts = probe hits incl.
# tests, which several of these do not yet exempt; promote per LN-2. Staged-
# promotion pattern mirrors missing_docs / undocumented_unsafe_blocks above.
panic = "allow"                        # PA-3 deny target; 1004 hits (mostly test panic!())
panic_in_result_fn = "allow"           # PA-1 deny target; 2 hits
unwrap_in_result = "allow"             # PA-1 deny target; 58 hits
arithmetic_side_effects = "allow"      # AR-1; 1844 hits - also needs clippy.toml scoping
let_underscore_must_use = "allow"      # EH-1; 417 hits
assertions_on_result_states = "allow"  # test weak-assert; 255 hits
allow_attributes = "allow"             # LN-2; 137 hits
redundant_clone = "allow"              # CL-1; 73 hits (nursery)
needless_collect = "allow"             # CL-2; 64 hits (nursery)
map_err_ignore = "allow"               # EH-2; 36 hits

# Optimized release profile for final/published builds.
# Use: cargo build --profile release-lto
# ~20% faster binaries, ~3.5x longer build vs --release.
[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1

# PGO-optimized release profile. Used by scripts/pgo-build.sh.
# RUSTFLAGS supplies -Cprofile-generate or -Cprofile-use on top.
[profile.release-pgo]
inherits = "release"
lto = "fat"
codegen-units = 1
