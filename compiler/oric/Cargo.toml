[package]
name = "oric"
version.workspace = true
edition = "2021"
description = "The Ori compiler - Salsa-first incremental compilation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/upstat-io/ori-lang"
keywords = ["compiler", "programming-language", "ori", "incremental", "salsa"]
categories = ["compilers", "development-tools"]

[lib]
name = "oric"
path = "src/lib.rs"

[[bin]]
name = "ori"
path = "src/main.rs"

[features]
default = ["llvm"]
llvm = ["dep:ori_llvm", "dep:ori_arc", "dep:ori_repr"]  # Requires LLVM 21 installed; always on
# Gates the backend-boundary plan's north-star conformance test — a trivial
# outside-crate CodegenBackend, proving zero further oric driver changes.
backend_stub_conformance = []

[dependencies]
# Incremental compilation - THE FOUNDATION
salsa.workspace = true

# Ori crates
ori_ir.workspace = true
ori_registry.workspace = true
ori_diagnostic.workspace = true
ori_lexer.workspace = true
ori_types.workspace = true
ori_parse.workspace = true
ori_patterns.workspace = true
ori_eval.workspace = true
ori_canon.workspace = true
ori_fmt.workspace = true

# LLVM backend (requires LLVM 21 installed)
ori_llvm = { path = "../ori_llvm", optional = true }

# ARC analysis (required for LLVM codegen borrow inference)
ori_arc = { path = "../ori_arc", optional = true }

# Representation optimization (LLVM codegen: type narrowing decisions)
ori_repr = { path = "../ori_repr", optional = true }

# Concurrency and hashing
parking_lot.workspace = true
rustc-hash.workspace = true
sha2 = "0.10"

# Machine-readable test output (`ori test --format json`): serde escapes
# arbitrary failure-message control chars by construction; hand-rendering does not.
serde.workspace = true
serde_json = "1"

# Parallel test execution
rayon.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-tree.workspace = true
thiserror.workspace = true

# Temp files for AOT intermediate objects
tempfile = "3.10"

# File watching (ori watch)
notify = "7"

# SCIP definition-index emission (`ori emit-scip`) + its protobuf wire format.
scip = "0.8.1"
protobuf = "3"

# Safe process-group kill for test-worker subprocess isolation.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
pretty_assertions = "1.4"
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3.10"
ori_rt = { path = "../ori_rt" }
# Format-spec SSOT (variant-registration consistency tests)
ori_format.workspace = true
ori_lexer_core.workspace = true
ori_test_harness = { path = "../ori_test_harness" }
ori_vm.workspace = true

[[test]]
name = "backend_stub_conformance"
path = "tests/backend_stub_conformance.rs"
required-features = ["llvm", "backend_stub_conformance"]

[[bench]]
name = "type_check"
harness = false

[[bench]]
name = "lexer"
harness = false

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "formatter"
harness = false

[[bench]]
name = "lexer_core"
harness = false

[[bench]]
name = "memory"
harness = false

[[bench]]
name = "vm"
harness = false

[[bench]]
name = "borrow_inference"
harness = false

[[bench]]
name = "pool_interning"
harness = false

[lints]
workspace = true
