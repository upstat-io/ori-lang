name: Notify website of content change

on:
  workflow_run:
    workflows: ["Auto Release"]
    types: [completed]

jobs:
  notify:
    runs-on: ubuntu-latest
    # Only notify on success (skip if auto-release was skipped or failed)
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Trigger website rebuild
        run: |
          gh api repos/upstat-io/ori-lang-website/dispatches \
            -f event_type=ori-lang-content-updated
        env:
          GH_TOKEN: ${{ secrets.ORI_LANG_PAT }}
