name: Release

on:
  push:
    tags:
      - 'v*'

# Cancel previous runs on the same tag (e.g., if tag is force-pushed)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LLVM_VERSION: "17"

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on master branch
        run: |
          # Check if the tagged commit is reachable from master
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/master; then
            echo "ERROR: Release tags must be on the master branch."
            echo ""
            echo "The tagged commit (${{ github.sha }}) is not on master."
            echo "Please ensure you're tagging a commit that has been merged to master."
            exit 1
          fi
          echo "Tag is on master branch - OK"

      - name: Check version synchronization
        run: ./scripts/sync-version.sh --check

  # Linux builds use Docker container with LLVM pre-installed
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          # TODO: Enable aarch64 once cross-compilation with LLVM is sorted
          # - arch: aarch64
          #   target: aarch64-unknown-linux-gnu
          #   name: linux-aarch64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive build number from tag
        run: |
          # Extract full version from tag: v2026.02.27.2-alpha → 2026.02.27.2-alpha
          BUILD="${GITHUB_REF_NAME#v}"
          if [[ -n "$BUILD" ]]; then
            echo "$BUILD" > BUILD_NUMBER
          else
            ./scripts/bump-build.sh  # Fallback
          fi
          echo "Build number: $(cat BUILD_NUMBER)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build LLVM Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker/llvm
          load: true
          tags: ori-llvm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build with LLVM
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace ori-llvm:latest \
            sh -c "cargo build --release --features llvm -p oric && strip /workspace/target/release/ori"

      - name: Package
        run: |
          mkdir -p staging
          cp target/release/ori staging/
          cp -r library staging/library
          cd staging
          tar -czvf ../ori-${{ github.ref_name }}-${{ matrix.name }}.tar.gz ori library/
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ori-${{ matrix.name }}
          path: ori-${{ github.ref_name }}-${{ matrix.name }}.tar.gz

  # macOS builds install LLVM via Homebrew
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            name: darwin-x86_64
          - arch: aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            name: darwin-aarch64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive build number from tag
        run: |
          # Extract full version from tag: v2026.02.27.2-alpha → 2026.02.27.2-alpha
          BUILD="${GITHUB_REF_NAME#v}"
          if [[ -n "$BUILD" ]]; then
            echo "$BUILD" > BUILD_NUMBER
          else
            ./scripts/bump-build.sh  # Fallback
          fi
          echo "Build number: $(cat BUILD_NUMBER)"

      - name: Install LLVM
        run: |
          brew install llvm@${{ env.LLVM_VERSION }}
          echo "LLVM_SYS_170_PREFIX=$(brew --prefix llvm@${{ env.LLVM_VERSION }})" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build with LLVM
        run: cargo build --release --features llvm -p oric --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/ori staging/
          strip staging/ori
          cp -r library staging/library
          cd staging
          tar -czvf ../ori-${{ github.ref_name }}-${{ matrix.name }}.tar.gz ori library/
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ori-${{ matrix.name }}
          path: ori-${{ github.ref_name }}-${{ matrix.name }}.tar.gz

  # Windows builds use our custom LLVM package with all targets
  # See: https://github.com/upstat-io/llvm-package-windows
  build-windows:
    name: Build Windows (x86_64)
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      LLVM_SYS_170_PREFIX: C:\LLVM

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive build number
        shell: bash
        run: ./scripts/bump-build.sh

      - name: Download LLVM
        run: |
          # Download our pre-built LLVM with all targets
          $LLVM_URL = "https://github.com/upstat-io/llvm-package-windows/releases/download/v17.0.6/LLVM-17.0.6-win64.7z"
          Write-Host "Downloading LLVM from $LLVM_URL"
          curl.exe -fLO $LLVM_URL
          Write-Host "Extracting LLVM to C:\LLVM..."
          7z x LLVM-17.0.6-win64.7z -oC:\LLVM

      - name: Verify LLVM
        run: |
          Write-Host "LLVM_SYS_170_PREFIX = $env:LLVM_SYS_170_PREFIX"
          & "$env:LLVM_SYS_170_PREFIX\bin\llvm-config.exe" --version
          & "$env:LLVM_SYS_170_PREFIX\bin\llvm-config.exe" --targets-built

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build with LLVM
        run: cargo build --release --features llvm -p oric --target x86_64-pc-windows-msvc

      - name: Package
        run: |
          mkdir staging
          Copy-Item target/x86_64-pc-windows-msvc/release/ori.exe staging/
          Copy-Item -Recurse library staging/library
          cd staging
          7z a ../ori-${{ github.ref_name }}-windows-x86_64.zip ori.exe library/
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ori-windows-x86_64
          path: ori-${{ github.ref_name }}-windows-x86_64.zip

  release:
    name: Create Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: ori-linux-x86_64
          path: artifacts

      - name: Download macOS x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: ori-darwin-x86_64
          path: artifacts

      - name: Download macOS aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: ori-darwin-aarch64
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ori-windows-x86_64
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum ori-* > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Determine release type
        id: release_type
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *"alpha"* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "name=Ori $VERSION (Nightly)" >> $GITHUB_OUTPUT
            echo "This is an alpha/nightly release"
          elif [[ "$VERSION" == *"beta"* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "name=Ori $VERSION (Beta)" >> $GITHUB_OUTPUT
            echo "This is a beta release"
          elif [[ "$VERSION" == *"rc"* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "name=Ori $VERSION (Release Candidate)" >> $GITHUB_OUTPUT
            echo "This is a release candidate"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "name=Ori $VERSION" >> $GITHUB_OUTPUT
            echo "This is a stable release"
          fi

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_type.outputs.name }}
          files: |
            artifacts/*
          prerelease: ${{ steps.release_type.outputs.prerelease }}
          make_latest: ${{ steps.release_type.outputs.prerelease != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
