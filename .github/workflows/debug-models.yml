name: Debug Copilot Models

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Copilot CLI + Python SDK
        run: |
          npm i -g @github/copilot
          pip install github-copilot-sdk
          echo "Copilot CLI version:"
          copilot --version || echo "(no --version flag)"

      # Test 1a: CLI with COPILOT_GITHUB_TOKEN (user PAT)
      - name: "Test 1a: CLI with user PAT"
        if: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          echo "--- Running: copilot -p with COPILOT_GITHUB_TOKEN ---"
          OUTPUT=$(copilot -p "Reply with exactly: CLI_PAT_OK" 2>&1) || true
          echo "$OUTPUT"

      # Test 1b: CLI with built-in GITHUB_TOKEN
      - name: "Test 1b: CLI with GITHUB_TOKEN"
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "--- Running: copilot -p with GITHUB_TOKEN ---"
          OUTPUT=$(copilot -p "Reply with exactly: CLI_GHTOKEN_OK" 2>&1) || true
          echo "$OUTPUT"

      # Test 2: SDK with PermissionHandler fix + claude-sonnet-4.5
      - name: "Test 2: SDK claude-sonnet-4.5 (PAT)"
        if: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import asyncio, sys
          from copilot import CopilotClient, PermissionHandler

          async def main():
              client = CopilotClient()
              await client.start()
              try:
                  session = await client.create_session({
                      "model": "claude-sonnet-4.5",
                      "streaming": False,
                      "on_permission_request": PermissionHandler.approve_all,
                  })
                  done = asyncio.Event()
                  result = []
                  def on_event(event):
                      t = event.type.value if hasattr(event.type, 'value') else str(event.type)
                      if t == "assistant.message":
                          content = event.data.content if hasattr(event.data, 'content') else str(event.data)
                          result.append(content)
                          print(f"[{t}] {content}")
                      elif t == "session.idle":
                          done.set()
                      else:
                          print(f"[{t}] {event.data}")
                  session.on(on_event)
                  await session.send({"prompt": "Reply with exactly: SDK_45_OK"})
                  await asyncio.wait_for(done.wait(), timeout=60)
                  print(f"SUCCESS: {result[-1] if result else 'NO RESPONSE'}")
              except Exception as e:
                  print(f"FAILED: {e}", file=sys.stderr)
                  sys.exit(1)
              finally:
                  await client.stop()
          asyncio.run(main())
          PYEOF

      # Test 3: SDK with GITHUB_TOKEN + claude-sonnet-4.5
      - name: "Test 3: SDK claude-sonnet-4.5 (GITHUB_TOKEN)"
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import asyncio, sys
          from copilot import CopilotClient, PermissionHandler

          async def main():
              client = CopilotClient()
              await client.start()
              try:
                  session = await client.create_session({
                      "model": "claude-sonnet-4.5",
                      "streaming": False,
                      "on_permission_request": PermissionHandler.approve_all,
                  })
                  done = asyncio.Event()
                  result = []
                  def on_event(event):
                      t = event.type.value if hasattr(event.type, 'value') else str(event.type)
                      if t == "assistant.message":
                          content = event.data.content if hasattr(event.data, 'content') else str(event.data)
                          result.append(content)
                          print(f"[{t}] {content}")
                      elif t == "session.idle":
                          done.set()
                      else:
                          print(f"[{t}] {event.data}")
                  session.on(on_event)
                  await session.send({"prompt": "Reply with exactly: SDK_GHTOKEN_OK"})
                  await asyncio.wait_for(done.wait(), timeout=60)
                  print(f"SUCCESS: {result[-1] if result else 'NO RESPONSE'}")
              except Exception as e:
                  print(f"FAILED: {e}", file=sys.stderr)
                  sys.exit(1)
              finally:
                  await client.stop()
          asyncio.run(main())
          PYEOF

      # Test 4: SDK with claude-sonnet-4.6 (PAT)
      - name: "Test 4: SDK claude-sonnet-4.6 (PAT)"
        if: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import asyncio, sys
          from copilot import CopilotClient, PermissionHandler

          async def main():
              client = CopilotClient()
              await client.start()
              try:
                  session = await client.create_session({
                      "model": "claude-sonnet-4.6",
                      "streaming": False,
                      "on_permission_request": PermissionHandler.approve_all,
                  })
                  done = asyncio.Event()
                  result = []
                  def on_event(event):
                      t = event.type.value if hasattr(event.type, 'value') else str(event.type)
                      if t == "assistant.message":
                          content = event.data.content if hasattr(event.data, 'content') else str(event.data)
                          result.append(content)
                          print(f"[{t}] {content}")
                      elif t == "session.idle":
                          done.set()
                      else:
                          print(f"[{t}] {event.data}")
                  session.on(on_event)
                  await session.send({"prompt": "Reply with exactly: SDK_46_OK"})
                  await asyncio.wait_for(done.wait(), timeout=60)
                  print(f"SUCCESS: {result[-1] if result else 'NO RESPONSE'}")
              except Exception as e:
                  print(f"FAILED: {e}", file=sys.stderr)
                  sys.exit(1)
              finally:
                  await client.stop()
          asyncio.run(main())
          PYEOF

      # Test 5: GitHub Models API with GITHUB_TOKEN (direct curl)
      - name: "Test 5: GitHub Models API (direct curl)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "--- Testing GitHub Models API ---"
          # List available models
          echo "GET /models:"
          curl -s -w "\nHTTP %{http_code}\n" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://models.github.ai/inference/models" | head -100

          echo ""
          echo "--- Testing known model slugs ---"
          for MODEL in \
            "openai/gpt-4o-mini" \
            "anthropic/claude-sonnet-4-6" \
            "claude-sonnet-4.6" \
            "claude-sonnet-4.5"
          do
            CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              "https://models.github.ai/inference/chat/completions" \
              -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":5}")
            BODY=$(cat /tmp/resp.json 2>/dev/null | head -5)
            echo "$MODEL -> HTTP $CODE | $BODY"
          done

      # Test 6: Inspect available SDK methods
      - name: "Test 6: Inspect SDK API"
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import copilot
          print("copilot package dir:", dir(copilot))
          print()
          # Check for PermissionHandler
          if hasattr(copilot, 'PermissionHandler'):
              print("PermissionHandler:", dir(copilot.PermissionHandler))
          else:
              print("No PermissionHandler found")
              # Try alternative imports
              try:
                  from copilot.types import PermissionHandler
                  print("Found in copilot.types:", dir(PermissionHandler))
              except ImportError:
                  print("Not in copilot.types either")
              try:
                  from copilot import permissions
                  print("Found copilot.permissions:", dir(permissions))
              except ImportError:
                  print("No copilot.permissions module")
          PYEOF
