name: AIMS Proofs

on:
  pull_request:
    paths:
      - 'aims-proof/**'
      - '.github/workflows/aims-proofs.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  proof-corpus:
    name: Proof Corpus (hard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup default stable && rustup toolchain install stable --profile minimal

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the proof checker over the full corpus
        run: ORI_RUN_PROOFS=1 aims-proof/scripts/check-proofs.sh

  lean4-cross-validation:
    name: Lean 4 Cross-Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: proof-corpus
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup default stable && rustup toolchain install stable --profile minimal

      - name: Install Lean 4 toolchain (elan)
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "${RUNNER_TEMP}/elan-init.sh"
          bash "${RUNNER_TEMP}/elan-init.sh" -y --default-toolchain leanprover/lean4:stable
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"

      - name: Verify Lean 4 on PATH
        run: lean --version

      - name: Build the proof checker
        run: cargo build --release -p aims-proof-checker --manifest-path aims-proof/Cargo.toml

      - name: Cross-validate the critical-proof subset (emit-lean4 then lean --run)
        working-directory: aims-proof
        run: |
          set -e
          bash scripts/run-bootstrap-proofs.sh
          bash scripts/run-section-08-proofs.sh
          bash scripts/run-section-11-proofs.sh
