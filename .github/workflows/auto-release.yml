name: Auto Release

# Automatically version-bump, tag, and release on every merge to master.
# CI is guaranteed to have passed via branch protection (required status check).
# Uses CalVer: v2026.02.27.N-alpha (UTC date + daily build counter + release stage).
# The daily counter (N) is derived from git history via bump-build.sh, so multiple
# merges on the same day correctly get .1, .2, .3, etc.
#
# Flow: bump-build.sh → sync-version.sh → commit → tag → release
#
# REQUIRES: The ori-release-bot GitHub App must be a bypass actor in the
# master branch ruleset, so this workflow can push version-bump commits directly.
# Secrets: RELEASE_APP_ID, RELEASE_APP_PRIVATE_KEY (from the GitHub App)

on:
  push:
    branches: [master]

# Queue releases — don't cancel in-progress ones.
# Each merge gets its own tag, processed sequentially.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  auto-release:
    name: Tag & Release
    # Skip our own version-bump commits to avoid infinite loop.
    # CI is guaranteed by branch protection — this only runs after a merge to master.
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Copilot CLI + SDK
        run: |
          npm i -g @github/copilot
          pip install github-copilot-sdk

      - name: Derive release tag
        id: tag
        run: |
          # Derive build number from git history — handles daily counter increment.
          # bump-build.sh counts first-parent commits to master since midnight UTC,
          # so the 2nd merge of the day gets .2, 3rd gets .3, etc.
          ./scripts/bump-build.sh

          if [[ ! -f BUILD_NUMBER ]]; then
            echo "::error::BUILD_NUMBER file not found on master"
            exit 1
          fi

          BUILD_CONTENT=$(tr -d '[:space:]' < BUILD_NUMBER)
          if [[ -z "$BUILD_CONTENT" ]]; then
            echo "::error::BUILD_NUMBER file is empty"
            exit 1
          fi

          TAG="v${BUILD_CONTENT}"

          # Safety: skip if this exact tag already exists
          if git rev-parse "refs/tags/${TAG}" &>/dev/null; then
            echo "::warning::Tag ${TAG} already exists — skipping release"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Sync versions and commit
        if: steps.tag.outputs.skip != 'true'
        run: |
          # Update all Cargo.toml, package.json, and Astro versions from BUILD_NUMBER
          ./scripts/sync-version.sh

          # Commit if anything changed (BUILD_NUMBER and/or manifests)
          git config user.name "ori-release-bot[bot]"
          git config user.email "${{ secrets.RELEASE_APP_ID }}+ori-release-bot[bot]@users.noreply.github.com"
          git add BUILD_NUMBER Cargo.toml compiler/ori_llvm/Cargo.toml compiler/ori_rt/Cargo.toml \
                  tools/ori-lsp/Cargo.toml editors/vscode-ori/package.json
          if git diff --cached --quiet; then
            echo "Versions already in sync — no commit needed"
          else
            git commit -m "chore: release ${{ steps.tag.outputs.tag }}"
          fi

      - name: Detect compiler changes
        if: steps.tag.outputs.skip != 'true'
        id: changes
        run: |
          # Find the most recent release tag
          PREV_TAG=$(git tag --sort=-creatordate | grep '^v' | head -1)

          if [[ -z "$PREV_TAG" ]]; then
            echo "No previous tag — first release, treating as compiler change"
            echo "compiler_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if any compiler-relevant files changed since last release.
          # Matches: Rust/C/H sources in compiler/, Ori sources in library/,
          #          anything in tests/, dependency lockfile changes.
          # Does NOT match: .github/, scripts/, docs/, plans/, editors/,
          #                 Cargo.toml version bumps, BUILD_NUMBER, etc.
          if git diff --name-only "$PREV_TAG"..HEAD \
              | grep -qE '^(compiler/.*\.(rs|c|h)|library/.*\.ori|tests/|Cargo\.lock$)'; then
            echo "Compiler changes detected — full release with binaries"
            echo "compiler_changes=true" >> $GITHUB_OUTPUT
          else
            echo "Housekeeping only — release without binaries"
            git diff --name-only "$PREV_TAG"..HEAD
            echo "compiler_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Push version commit and tag
        if: steps.tag.outputs.skip != 'true'
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [[ "${{ steps.changes.outputs.compiler_changes }}" == "true" ]]; then
            # Push commit + tag — tag push triggers the binary release workflow
            git tag "$TAG"
            git push origin master "$TAG"
          else
            # Push commit only — tag will be created via API (no binary build triggered)
            git push origin master
          fi

      - name: Generate release notes
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          python3 scripts/generate-release-notes.py \
            --tag "${{ steps.tag.outputs.tag }}" \
            -o /tmp/release-notes.txt

      - name: Create release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          NOTES=$(cat /tmp/release-notes.txt)

          if [[ "${{ steps.changes.outputs.compiler_changes }}" == "true" ]]; then
            # Full release — binaries will be attached by the Release workflow
            gh release create "$TAG" \
              --title "Ori ${TAG#v}" \
              --notes "$NOTES" \
              --prerelease
          else
            # Housekeeping release — create tag via API (won't trigger Release workflow)
            gh release create "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --title "Ori ${TAG#v} (No Compiler Changes)" \
              --notes "$NOTES" \
              --prerelease
          fi
