name: Auto Release

# Automatically tag and release on every merge to master — but ONLY after CI passes.
# Uses CalVer: v2026.02.27.N-alpha (UTC date + daily build counter + release stage).
# The release stage (alpha, beta, rc) comes from the RELEASE_STAGE file.
# No commits to master — just tags the merge commit directly.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

# Queue releases — don't cancel in-progress ones.
# Each merge gets its own tag, processed sequentially.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  auto-release:
    name: Tag & Release
    # Only release if CI succeeded — never release on failure
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ORILANG_RELEASE_TOKEN }}
          fetch-depth: 0
          ref: master

      - name: Derive release tag
        id: tag
        run: |
          # Read release stage from the single source of truth
          STAGE=""
          if [[ -f RELEASE_STAGE ]]; then
            STAGE=$(tr -d '[:space:]' < RELEASE_STAGE)
          fi

          TODAY=$(date -u +"%Y.%m.%d")
          COUNT=1

          # Build the version suffix
          if [[ -n "$STAGE" ]]; then
            SUFFIX="-${STAGE}"
          else
            SUFFIX=""
          fi

          while git rev-parse "refs/tags/v${TODAY}.${COUNT}${SUFFIX}" &>/dev/null; do
            COUNT=$((COUNT + 1))
          done
          TAG="v${TODAY}.${COUNT}${SUFFIX}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Push tag
        run: |
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Gather commit log
        id: commits
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          # Find previous tag for release notes range
          PREV_TAG=$(git tag --sort=-creatordate | grep '^v' | sed -n '2p')

          if [[ -n "$PREV_TAG" ]]; then
            LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
            DIFF_STAT=$(git diff "${PREV_TAG}..HEAD" --stat | tail -1)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
            DIFF_STAT=""
          fi

          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

          # Write to file to avoid shell quoting issues
          echo "$LOG" > /tmp/commit-log.txt
          echo "$DIFF_STAT" > /tmp/diff-stat.txt

      - name: Generate AI release notes
        id: ai_notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_LOG=$(cat /tmp/commit-log.txt)
          DIFF_STAT=$(cat /tmp/diff-stat.txt)
          TAG="${{ steps.tag.outputs.tag }}"
          PREV_TAG="${{ steps.commits.outputs.prev_tag }}"

          # Build the prompt
          PROMPT=$(cat <<'PROMPT_EOF'
          You are writing release notes for "Ori", a statically-typed, expression-based programming language compiler. Given the commit log below, write concise, user-friendly release notes in markdown.

          Rules:
          - Group changes into sections: **Features**, **Bug Fixes**, **Improvements**, **Internal** (only if meaningful)
          - Omit empty sections
          - Use past tense ("Added", "Fixed", "Improved")
          - Keep each bullet to one line
          - Skip merge commits and CI-only changes
          - If there are no user-facing changes, just say "Internal improvements and maintenance."
          - Do NOT wrap in ```markdown fences
          PROMPT_EOF
          )

          # Append the actual data
          FULL_PROMPT="${PROMPT}

          Commit log (${PREV_TAG:-beginning}..${TAG}):
          ${COMMIT_LOG}

          Diff stats: ${DIFF_STAT}"

          # Call GitHub Models API
          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            "https://models.github.ai/inference/chat/completions" \
            -d "$(jq -n \
              --arg prompt "$FULL_PROMPT" \
              '{
                model: "openai/gpt-4o-mini",
                messages: [
                  { role: "user", content: $prompt }
                ],
                temperature: 0.3
              }')")

          # Extract the content from the response
          AI_NOTES=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [[ -z "$AI_NOTES" ]]; then
            echo "::warning::AI note generation failed, falling back to commit log"
            AI_NOTES="## Changes

          ${COMMIT_LOG}"
          fi

          # Write to file for the next step
          echo "$AI_NOTES" > /tmp/release-notes.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.ORILANG_RELEASE_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          NOTES=$(cat /tmp/release-notes.txt)

          gh release create "$TAG" \
            --title "Ori ${TAG#v}" \
            --notes "$NOTES" \
            --prerelease
