name: Deploy Website

on:
  # Deploy after CI completes on master (includes PR merges)
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  # Deploy directly on release commits (CI is skipped for these, but website needs version update)
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read  # Needed to download artifacts from other workflows

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # push: only for release commits (CI is skipped, but website needs the version)
    # workflow_run: only when CI succeeded (not when skipped for release commits)
    # workflow_dispatch: always
    if: >-
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: release v')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Fetch test results from CI
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          branch: master
          name: test-results
          path: website/public
          run_id: ${{ github.event.workflow_run.id }}
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Fetch LLVM test results from CI
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          branch: master
          name: llvm-test-results
          path: website/public
          run_id: ${{ github.event.workflow_run.id }}
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Merge test results
        run: |
          cd website/public
          # Create default if missing
          if [ ! -f test-results.json ]; then
            echo '{"timestamp":"","overall":"unknown","suites":[],"totals":{"passed":0,"failed":0,"skipped":0,"lcfail":0}}' > test-results.json
          fi
          # Merge LLVM suites into main results if artifact was downloaded
          if [ -f llvm-test-results.json ]; then
            # Concatenate suites arrays and recompute totals + overall
            jq -s '
              {
                timestamp: (if .[1].timestamp > .[0].timestamp then .[1].timestamp else .[0].timestamp end),
                overall: (if ([.[].suites[].failed // 0] | add) > 0 then "failed" else "passed" end),
                suites: ([.[].suites] | add),
                totals: {
                  passed: ([.[].suites[] | .passed // 0] | add),
                  failed: ([.[].suites[] | .failed // 0] | add),
                  skipped: ([.[].suites[] | .skipped // 0] | add),
                  lcfail: ([.[].suites[] | .lcfail // 0] | add)
                }
              }
            ' test-results.json llvm-test-results.json > combined-test-results.json
            mv combined-test-results.json test-results.json
            rm -f llvm-test-results.json
          else
            echo "LLVM test results artifact not found, preserving existing data"
          fi
          echo "Test results:"
          cat test-results.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: website/playground-wasm -> website/playground-wasm/target
          cache-on-failure: true

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Derive build number
        run: ./scripts/bump-build.sh

      - name: Build WASM
        run: |
          cd website/playground-wasm
          wasm-pack build --target web --out-dir pkg --release

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install website dependencies
        run: bun install
        working-directory: website

      - name: Copy install script to website
        run: cp install.sh website/public/install.sh

      - name: Copy WASM to website
        run: bash scripts/copy-wasm.sh
        working-directory: website

      - name: Generate changelog
        run: bash scripts/generate-changelog.sh
        working-directory: website

      - name: Build website
        run: bun run build
        working-directory: website

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
