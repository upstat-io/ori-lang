name: Deploy Website

on:
  # Deploy after Auto Release completes — ensures the release tag exists
  # before the website goes live with that version number.
  workflow_run:
    workflows: ["Auto Release"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read  # Needed to download test-results artifact from CI workflow

concurrency:
  group: pages
  cancel-in-progress: true

env:
  RUST_VERSION: "1.93.1"

jobs:
  build:
    # Deploy if Auto Release succeeded OR was skipped (the bot's version-bump
    # commit re-triggers Auto Release which self-skips to prevent loops — that
    # skipped run races the successful deploy via cancel-in-progress).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Fetch test results from CI
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          branch: master
          name: test-results
          path: website/public
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Validate test results
        run: |
          cd website/public
          if [ ! -f test-results.json ]; then
            echo '{"timestamp":"","overall":"unknown","suites":[],"totals":{"passed":0,"failed":0,"skipped":0,"lcfail":0}}' > test-results.json
          fi
          echo "Test results:"
          cat test-results.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: website/playground-wasm -> website/playground-wasm/target
          cache-on-failure: true

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Derive build number
        run: ./scripts/bump-build.sh

      - name: Build WASM
        run: |
          cd website/playground-wasm
          wasm-pack build --target web --out-dir pkg --release

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install website dependencies
        run: bun install
        working-directory: website

      - name: Copy install script to website
        run: cp install.sh website/public/install.sh

      - name: Copy WASM to website
        run: bash scripts/copy-wasm.sh
        working-directory: website

      - name: Generate changelog
        run: bash scripts/generate-changelog.sh
        working-directory: website

      - name: Build website
        run: bun run build
        working-directory: website

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
