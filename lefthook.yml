# Lefthook configuration for git hooks
# Install: https://github.com/evilmartians/lefthook
#   macOS:  brew install lefthook
#   Linux:  wget -O ~/.local/bin/lefthook https://github.com/evilmartians/lefthook/releases/latest/download/lefthook_Linux_x86_64 && chmod +x ~/.local/bin/lefthook
#   Any:    go install github.com/evilmartians/lefthook@latest
# Then run: lefthook install

pre-commit:
  commands:
    fmt:
      glob: "*.{rs,toml,ori,sh,json,yml,yaml,js,ts}"
      run: ./fmt-all.sh
      stage_fixed: true
    full-check:
      glob: "*.{rs,toml,ori,sh,json,yml,yaml,js,ts}"
      run: ./full-check.sh
    version-sync:
      glob: "**/Cargo.toml|**/package.json|**/BaseLayout.astro"
      run: ./scripts/sync-version.sh --check
    spec-proposal-gate:
      glob: "docs/ori_lang/v2026/spec/**"
      run: .lefthook/check-spec-proposal-gate.sh

post-commit:
  commands:
    intel-sync:
      run: |
        if [ -x ../lang_intelligence/scripts/sync-ori-graph.sh ]; then
          CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD -- 'compiler/*.rs' 'library/*.ori' 'library/*.rs')
          if [ -n "$CHANGED" ]; then
            mkdir -p ../lang_intelligence/logs
            ../lang_intelligence/scripts/sync-ori-graph.sh --changed "$CHANGED" >> ../lang_intelligence/logs/ori-sync.log 2>&1 &
          fi
        fi
      # Fire-and-forget: returns immediately, sync runs in background
      # If lang_intelligence doesn't exist, the -x test fails silently
      # Scoped to compiler/ and library/ per repos.yaml include roots

commit-msg:
  commands:
    conventional-commit:
      run: .lefthook/commit-msg.sh {1}
    spec-proposal-gate:
      run: .lefthook/check-spec-proposal-msg.sh {1}
